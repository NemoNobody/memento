name: Feature request or feedback
description: A capability you are missing, or how velruna works for your workflow
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One form for both: a concrete feature ask and "here is how I use it, this
        part hurts" are the same conversation. The second kind is often more
        useful — it tells where the tool actually sits in a workflow.

        Scope note: velruna is verified memory over OpenSearch (facts + provenance +
        journal + a fetched-docs cache). See README "Non-goals" before proposing a
        different storage backend, semantic search or secret storage.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does velruna get in the way? Describe the workflow, not only the missing command.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape (optional)
      description: A command, tool parameter or behavior you have in mind. Sketches are fine.
    validations:
      required: false
  - type: textarea
    id: usage
    attributes:
      label: How you use velruna (optional)
      description: |
        Single agent or several? One machine or a shared store? Facts only, or the docs cache too?
        This shapes priorities more than the number of votes.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - facts store (add/search/list/journal)
        - docs cache (fetch/get_doc)
        - dashboard
        - MCP server / agent integration
        - install / packaging / platform
        - documentation
        - other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked README "Non-goals" and this is not one of the deliberate non-goals listed there.
          required: false
