name: Release

# Cutting a tag (make release VERSION=vX.Y.Z) builds release binaries for the
# supported platforms and publishes them as a GitHub release. On a private
# repository the release is private too.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/NemoNobody/memento/internal/version.Version=${VERSION}"
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/memento-${os}-${arch}" .
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
