name: Release

# Cutting a tag (make release VERSION=vX.Y.Z) builds release binaries for the
# supported platforms and publishes them as a GitHub release. On a private
# repository the release is private too.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA:0:7}"
          LDFLAGS="-s -w -X github.com/NemoNobody/memento/internal/version.Version=${VERSION} -X github.com/NemoNobody/memento/internal/version.Commit=${COMMIT}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/memento-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" .
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # Release notes come from the CHANGELOG section for this tag
          # ("## v0.6.0 — ..."); fall back to generated notes if absent.
          awk -v v="$VERSION" '$0 ~ "^## "v {p=1; print; next} /^## / {p=0} p {print}' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" dist/* --generate-notes
          fi
