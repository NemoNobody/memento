name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Cross-compile (darwin, windows)
        run: |
          # The keyring dispatcher's non-linux providers (zalando) and the
          # MCP/CLI stack must compile everywhere: release binaries ship
          # darwin, and Windows users build from source. No tests run here
          # (no Darwin/Windows runners in this project's CI budget).
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
      - name: Test
        run: go test ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
